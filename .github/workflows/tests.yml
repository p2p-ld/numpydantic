name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # Don't test intermediate versions on non-linux OSes, to save test time.
          - platform: "macos-latest"
            python-version: "3.12"
          - platform: "macos-latest"
            python-version: "3.13"
          - platform: "macos-latest"
            python-version: "3.14"
          - platform: "windows-latest"
            python-version: "3.12"
          - platform: "windows-latest"
            python-version: "3.13"
          - platform: "windows-latest"
            python-version: "3.15"   # no h5py wheels yet; should be 3.14

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HDF5 - linux (h5py has no 3.15 wheels yet)
        if: matrix.python-version == '3.15' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install HDF5 - mac (h5py has no 3.15 wheels yet)
        if: matrix.python-version == '3.15' && runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        id: cache-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pdm.lock', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install "pdm[locked]"
          pdm install --with tests

      - name: Run Tests
        id: tests
        run: pdm run test

      - name: Export coverage report
        run: pdm run coverage lcov -o coverage.lcov

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
          flag-name: run-${{ join(matrix.*, '-') }}
          parallel: true

  finish-coverage:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true